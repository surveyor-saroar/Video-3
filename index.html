<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scene 1 — AI Motion Graphics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Hind Siliguri', sans-serif;
      background-color: #060608;
      background-image: radial-gradient(circle at 50% 18%, rgba(255, 183, 3, 0.14), transparent 55%);
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      text-align: center;
    }

    #scene-1 {
      max-width: 1060px;
      margin: 0 auto;
      padding: 64px 20px;
    }

    .headline-lg {
      font-size: clamp(2rem, 4.4vw, 3.25rem);
      font-weight: 800;
      line-height: 1.24;
      letter-spacing: -0.3px;
      margin-bottom: 14px;
    }

    .gold-text {
      background: linear-gradient(90deg, #ffd166, #ffb703, #fb8500);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subcopy {
      font-size: clamp(1rem, 1.8vw, 1.25rem);
      color: #c7c7d1;
      max-width: 720px;
      margin: 0 auto 38px;
    }

    .fanned-cards {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin: 24px auto 8px;
      perspective: 1100px;
    }

    .fan-card {
      width: 172px;
      height: 248px;
      border-radius: 20px;
      background: linear-gradient(170deg, #17171d 0%, #0b0b0e 100%);
      border: 1.5px solid rgba(255, 183, 3, 0.55);
      box-shadow:
        0 18px 36px rgba(0, 0, 0, 0.85),
        0 0 24px rgba(255, 183, 3, 0.14);
      padding: 16px 14px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease, border-color 0.35s ease;
    }

    .fan-card:nth-child(1) { transform: rotate(-11deg) translateY(14px); }
    .fan-card:nth-child(2) { transform: rotate(-5deg) translateY(5px); }
    .fan-card.featured {
      transform: rotate(0deg) translateY(-6px) scale(1.06);
      border: 2px solid #ffb703;
      box-shadow:
        0 22px 44px rgba(0, 0, 0, 0.9),
        0 0 32px rgba(255, 183, 3, 0.26);
    }
    .fan-card:nth-child(4) { transform: rotate(5deg) translateY(5px); }
    .fan-card:nth-child(5) { transform: rotate(11deg) translateY(14px); }

    .fan-card:hover {
      transform: translateY(-16px) scale(1.08) rotate(0deg);
      border-color: #ffd166;
      box-shadow:
        0 24px 48px rgba(0, 0, 0, 0.92),
        0 0 36px rgba(255, 183, 3, 0.38);
    }

    .fan-thumb {
      width: 100%;
      height: 152px;
      border-radius: 14px;
      background: radial-gradient(circle at 50% 42%, rgba(255, 183, 3, 0.22), rgba(14, 14, 18, 0.96) 72%);
      border: 1px solid rgba(255, 183, 3, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-svg {
      width: 56px;
      height: 56px;
      filter: drop-shadow(0 0 12px rgba(255, 183, 3, 0.35));
      transition: transform 0.35s ease, filter 0.35s ease;
    }

    .fan-card.featured .card-svg {
      width: 62px;
      height: 62px;
      filter: drop-shadow(0 0 16px rgba(255, 183, 3, 0.52));
    }

    .fan-card:hover .card-svg {
      transform: scale(1.12);
      filter: drop-shadow(0 0 20px rgba(255, 183, 3, 0.65));
    }

    .fan-tag {
      width: 92%;
      background: linear-gradient(180deg, #ffc424 0%, #f59e0b 100%);
      color: #09090b;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 7px 10px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(255, 183, 3, 0.25);
    }
  </style>
</head>
<body>
  <section id="scene-1">
    <h1 class="headline-lg">
      Video বানাতে editor-কে <span class="gold-text">হাজার হাজার টাকা</span><br />
      দিচ্ছেন?
    </h1>
    <p class="subcopy">
      অথচ নিজেই বানাতে পারেন বিক্রি আনার মতো সেরা video বিজ্ঞাপন।
    </p>

    <div class="fanned-cards">
      <div class="fan-card">
        <div class="fan-thumb">
          <svg class="card-svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <rect x="8" y="22" width="48" height="32" rx="6" fill="#23232d" stroke="#ffb703" stroke-width="2.5"/>
            <path d="M10 22L52 10L55 20L13 32L10 22Z" fill="#ffb703"/>
            <path d="M19 19L24 29M31 16L36 26M43 13L48 23" stroke="#0b0b0e" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M27 33L39 39L27 45V33Z" fill="#ffd166"/>
          </svg>
        </div>
        <div class="fan-tag">মার্কেট রিল</div>
      </div>

      <div class="fan-card">
        <div class="fan-thumb">
          <svg class="card-svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <path d="M14 27H22L44 16V48L22 37H14C11.8 37 10 35.2 10 33V31C10 28.8 11.8 27 14 27Z" fill="#ffb703"/>
            <path d="M20 37L24 50H30L26 37" stroke="#ffd166" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M49 24C52 26.8 53.5 29.8 53.5 32C53.5 34.2 52 37.2 49 40" stroke="#ffb703" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="fan-tag">বিজনেস অ্যাড</div>
      </div>

      <div class="fan-card featured">
        <div class="fan-thumb">
          <svg class="card-svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <path d="M34 10L38.2 21.8L50 26L38.2 30.2L34 42L29.8 30.2L18 26L29.8 21.8L34 10Z" fill="#ffb703"/>
            <path d="M18 39L20.4 45.6L27 48L20.4 50.4L18 57L15.6 50.4L9 48L15.6 45.6L18 39Z" fill="#ffd166"/>
            <circle cx="48" cy="44" r="3" fill="#fb8500"/>
          </svg>
        </div>
        <div class="fan-tag">মোশন গ্রাফিক্স</div>
      </div>

      <div class="fan-card">
        <div class="fan-thumb">
          <svg class="card-svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <rect x="12" y="12" width="40" height="40" rx="6" fill="#23232d" stroke="#ffb703" stroke-width="2.5"/>
            <line x1="20" y1="12" x2="20" y2="52" stroke="#ffb703" stroke-width="2"/>
            <line x1="44" y1="12" x2="44" y2="52" stroke="#ffb703" stroke-width="2"/>
            <path d="M14 19H20M14 27H20M14 35H20M14 43H20M44 19H50M44 27H50M44 35H50M44 43H50" stroke="#ffd166" stroke-width="2.2" stroke-linecap="round"/>
            <rect x="24" y="21" width="16" height="22" rx="2" fill="rgba(255, 183, 3, 0.22)" stroke="#ffd166" stroke-width="1.6"/>
          </svg>
        </div>
        <div class="fan-tag">ভিডিও এডিটিং</div>
      </div>

      <div class="fan-card">
        <div class="fan-thumb">
          <svg class="card-svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <rect x="23" y="11" width="18" height="28" rx="9" fill="#ffb703"/>
            <path d="M23 21H41M23 28H41" stroke="#0b0b0e" stroke-width="2"/>
            <path d="M17 29C17 37.3 23.7 43 32 43C40.3 43 47 37.3 47 29" stroke="#ffd166" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="32" y1="43" x2="32" y2="53" stroke="#ffb703" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="23" y1="53" x2="41" y2="53" stroke="#ffb703" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="fan-tag">ভয়েসওভার</div>
      </div>
    </div>
  </section>
</body>
</html>
