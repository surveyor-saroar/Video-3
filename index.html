<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050403">
  <title>Success of Skill — Motion Graphics</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top, #17130a 0%, #090d16 55%, #050403 100%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #particles {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .ambient {
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(110px);
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
    }

    .ambient-one {
      top: -120px;
      left: -100px;
      background: #f59e0b;
    }

    .ambient-two {
      bottom: -140px;
      right: -100px;
      background: #10b981;
    }

    .brand {
      position: fixed;
      top: 24px;
      left: 36px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fbbf24;
    }

    .brand small {
      color: #cbd5e1;
      font-weight: 600;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      z-index: 5;
      perspective: 1200px;
    }

    /* Smooth Scene Transition */
    .scene {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 28px 165px;
      background: transparent;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: scale(0.95) translateY(18px);
      filter: blur(8px);
      transition:
        opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.65s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.55s ease,
        visibility 0s linear 0.65s;
    }

    .scene.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: scale(1) translateY(0);
      filter: blur(0);
      transition:
        opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.65s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.55s ease,
        visibility 0s;
    }

    .scene.leaving {
      opacity: 0;
      visibility: visible;
      transform: scale(1.04) translateY(-16px);
      filter: blur(8px);
    }

    .eyebrow {
      font-size: 0.85rem;
      letter-spacing: 3px;
      color: #fbbf24;
      font-weight: 700;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(2.4rem, 5vw, 4.2rem);
      line-height: 1.2;
      font-weight: 900;
      margin-bottom: 20px;
      color: #ffffff;
    }

    h2 {
      font-size: clamp(1.9rem, 3.8vw, 3rem);
      line-height: 1.25;
      font-weight: 800;
      margin-bottom: 16px;
      color: #ffffff;
    }

    em {
      font-style: normal;
      color: #fbbf24;
    }

    .subline {
      margin-top: 22px;
      font-size: 1.1rem;
      color: #cbd5e1;
    }

    .floating-cards {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 14px 0;
    }

    .mini-card {
      width: 190px;
      padding: 16px;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(251, 191, 36, 0.28);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .fake-photo {
      height: 85px;
      border-radius: 12px;
    }

    .photo-a {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
    }

    .photo-b {
      background: linear-gradient(135deg, #10b981, #059669);
    }

    .photo-c {
      background: linear-gradient(135deg, #6366f1, #ec4899);
    }

    .searchbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 22px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(251, 191, 36, 0.35);
      margin-bottom: 18px;
    }

    .searchbar b {
      background: #fbbf24;
      color: #090d16;
      padding: 8px 16px;
      border-radius: 999px;
    }

    .chips,
    .bonus-pills,
    .cta-pills {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 14px 0;
    }

    .chips span,
    .bonus-pills span,
    .cta-pills span,
    .elim-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(20, 28, 45, 0.9);
      border: 1.5px solid rgba(34, 197, 94, 0.55);
      color: #f8fafc;
      font-weight: 700;
    }

    .showcase {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 14px;
    }

    .portrait {
      width: 200px;
      height: 150px;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(251, 191, 36, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .logo-large {
      font-size: 2.2rem;
      font-weight: 900;
      color: #fbbf24;
      margin-bottom: 10px;
    }

    .logo-large small {
      display: block;
      font-size: 0.9rem;
      letter-spacing: 4px;
      color: #cbd5e1;
    }

    .service-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 14px;
      margin: 16px 0;
    }

    .service-grid > div {
      padding: 14px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(251, 191, 36, 0.22);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .gold-button {
      margin-top: 10px;
      padding: 14px 30px;
      border-radius: 999px;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #090d16;
      font-weight: 900;
      font-size: 1.1rem;
    }

    .final-banner {
      margin-top: 14px;
      padding: 18px 28px;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(251, 191, 36, 0.45);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Dropper Highlight Effect */
    .dropper-active-target {
      outline: 2.5px solid var(--drop-color, #fbbf24) !important;
      box-shadow: 0 0 28px var(--drop-glow, rgba(251, 191, 36, 0.55)) !important;
      border-radius: 16px;
      transition: outline 0.25s ease, box-shadow 0.25s ease;
    }
