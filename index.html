<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Motion Graphics Masterclass — Interactive Motion Webpage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #060608;
      --bg-card: #111116;
      --gold-1: #ffb703;
      --gold-2: #fb8500;
      --gold-glow: rgba(255, 183, 3, 0.35);
      --text-main: #ffffff;
      --text-muted: #b8b8c2;
      --border-gold: rgba(255, 183, 3, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* Ambient Golden Radial Glow & Sparkles */
    .ambient-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 50% 12%, rgba(255, 183, 3, 0.14), transparent 45%),
        radial-gradient(circle at 15% 55%, rgba(251, 133, 0, 0.08), transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(255, 183, 3, 0.1), transparent 45%);
    }

    .sparkle {
      position: fixed;
      width: 10px;
      height: 10px;
      background: var(--gold-1);
      clip-path: polygon(50% 0%, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0% 50%, 38% 38%);
      opacity: 0.75;
      pointer-events: none;
      z-index: 1;
      animation: twinkle 3.2s infinite ease-in-out;
      filter: drop-shadow(0 0 8px var(--gold-1));
    }

    @keyframes twinkle {
      0%, 100% { transform: scale(0.7) rotate(0deg); opacity: 0.35; }
      50% { transform: scale(1.25) rotate(25deg); opacity: 0.95; }
    }

    /* Top Brand Bar & Auto-Play / Scroll Controls */
    header.topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(14px);
      background: rgba(6, 6, 8, 0.82);
      border-bottom: 1px solid rgba(255, 183, 3, 0.16);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.3px;
    }

    .brand-badge {
      background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
      color: #09090b;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 800;
      box-shadow: 0 0 18px var(--gold-glow);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-control {
      background: rgba(255, 183, 3, 0.12);
      color: var(--gold-1);
      border: 1px solid var(--border-gold);
      padding: 7px 14px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn-control:hover, .btn-control.active {
      background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
      color: #08080a;
      box-shadow: 0 0 20px var(--gold-glow);
    }

    /* Section Base */
    section.scene {
      position: relative;
      z-index: 2;
      max-width: 1040px;
      margin: 0 auto;
      padding: 72px 20px;
      text-align: center;
    }

    .gold-text {
      background: linear-gradient(90deg, #ffd166, var(--gold-1), var(--gold-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .headline-lg {
      font-size: clamp(1.9rem, 4.5vw, 3.3rem);
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 16px;
    }

    .subcopy {
      color: var(--text-muted);
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      max-width: 720px;
      margin: 0 auto 32px;
    }

    /* Reveal Animation */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.75s cubic-bezier(0.22, 1, 0.36, 1), transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Scene 1: Fanned Video Cards (0:00 - 0:05) */
    .fanned-cards {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin: 34px auto 18px;
      perspective: 1000px;
    }

    .fan-card {
      width: 165px;
      height: 235px;
      border-radius: 18px;
      background: linear-gradient(160deg, #1b1b22, #0d0d11);
      border: 1.5px solid var(--border-gold);
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.75), 0 0 22px rgba(255, 183, 3, 0.14);
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .fan-card:nth-child(1) { transform: rotate(-10deg) translateY(10px); }
    .fan-card:nth-child(2) { transform: rotate(-5deg) translateY(4px); }
    .fan-card:nth-child(3) { transform: rotate(0deg) translateY(-6px) scale(1.05); border-color: var(--gold-1); }
    .fan-card:nth-child(4) { transform: rotate(5deg) translateY(4px); }
    .fan-card:nth-child(5) { transform: rotate(10deg) translateY(10px); }

    .fan-card:hover {
      transform: translateY(-14px) scale(1.06) rotate(0deg);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.85), 0 0 28px var(--gold-glow);
    }

    .fan-thumb {
      height: 135px;
      border-radius: 12px;
      background: radial-gradient(circle at 30% 30%, rgba(255, 183, 3, 0.28), rgba(20, 20, 28, 0.95));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      border: 1px solid rgba(255, 183, 3, 0.2);
    }

    .fan-tag {
      background: var(--gold-1);
      color: #09090b;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 6px 10px;
      border-radius: 10px;
      text-align: center;
    }

    /* Scene 2: Prompt Bar & Strikethrough Eliminations (0:06 - 0:13) */
    .prompt-box {
      max-width: 700px;
      margin: 24px auto;
      background: #101015;
      border: 1.5px solid var(--border-gold);
      border-radius: 999px;
      padding: 12px 16px 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 0 30px rgba(255, 183, 3, 0.12);
    }

    .prompt-text {
      color: #f3f4f6;
      font-size: 1.05rem;
      text-align: left;
    }

    .ask-ai-pill {
      background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
      color: #09090b;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 999px;
      white-space: nowrap;
      font-size: 0.95rem;
    }

    .eliminations {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin: 22px 0 30px;
    }

    .elim-chip {
      position: relative;
      background: #15151b;
      border: 1px solid rgba(255, 183, 3, 0.28);
      color: #d4d4d8;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 1.05rem;
      font-weight: 600;
      overflow: hidden;
    }

    .elim-chip::after {
      content: "";
      position: absolute;
      left: -8%;
      top: 50%;
      width: 116%;
      height: 3px;
      background: #ff4d4d;
      transform: rotate(-8deg) scaleX(0);
      transform-origin: left;
      transition: transform 0.6s ease 0.2s;
      box-shadow: 0 0 10px rgba(255, 77, 77, 0.8);
    }

    .reveal.visible .elim-chip::after {
      transform: rotate(-8deg) scaleX(1);
    }

    .market-sera-box {
      display: inline-block;
      margin-top: 10px;
      padding: 16px 36px;
      border-radius: 18px;
      border: 2px solid var(--gold-1);
      background: rgba(255, 183, 3, 0.08);
      box-shadow: 0 0 32px var(--gold-glow);
      font-size: clamp(1.5rem, 3.5vw, 2.4rem);
      font-weight: 800;
      color: var(--gold-1);
    }

    /* Scene 3: 2-Second Scroll Hook & No Sale = No Touch (0:14 - 0:21) */
    .scroll-comparison {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-top: 28px;
      align-items: center;
    }

    .hook-preview {
      background: #111117;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 18px;
      text-align: left;
    }

    .hook-badge {
      display: inline-block;
      background: rgba(255, 183, 3, 0.16);
      color: var(--gold-1);
      border: 1px solid var(--border-gold);
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .skip-banner {
      background: linear-gradient(135deg, rgba(255, 183, 3, 0.16), rgba(251, 133, 0, 0.08));
      border: 1.5px solid var(--gold-1);
      border-radius: 22px;
      padding: 28px 22px;
      box-shadow: 0 0 28px rgba(255, 183, 3, 0.14);
    }

    .timer-pill {
      display: inline-block;
      background: #1c1c24;
      border: 1px solid var(--border-gold);
      color: var(--gold-1);
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    /* Heartbeat / Sales Line SVG */
    .pulse-card {
      margin-top: 38px;
      background: #0f0f14;
      border: 1px solid var(--border-gold);
      border-radius: 22px;
      padding: 24px;
    }

    .pulse-path {
      stroke-dasharray: 900;
      stroke-dashoffset: 900;
      transition: stroke-dashoffset 1.6s ease;
    }

    .reveal.visible .pulse-path {
      stroke-dashoffset: 0;
    }

    /* Scene 4: Masterclass Core Pillars (0:22 - 0:29) */
    .pillar-pills {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-top: 26px;
    }

    .pillar-pill {
      padding: 12px 28px;
      border-radius: 999px;
      font-size: 1.15rem;
      font-weight: 700;
      background: #14141b;
      border: 1.5px solid var(--border-gold);
      color: #fff;
      box-shadow: 0 0 18px rgba(255, 183, 3, 0.15);
    }

    .pillar-pill.cta-highlight {
      background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
      color: #09090b;
      border: none;
      box-shadow: 0 0 28px var(--gold-glow);
    }

    /* Scene 5: All Business Grid (0:30 - 0:41) */
    .business-container {
      background: #0e0e13;
      border: 1.5px solid var(--border-gold);
      border-radius: 26px;
      padding: 28px 20px;
      box-shadow: 0 0 36px rgba(255, 183, 3, 0.1);
    }

    .all-biz-tag {
      display: inline-block;
      background: rgba(255, 183, 3, 0.14);
      border: 1px solid var(--gold-1);
      color: var(--gold-1);
      padding: 6px 18px;
      border-radius: 999px;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .biz-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
    }

    .biz-item {
      background: #15151d;
      border: 1px solid rgba(255, 183, 3, 0.22);
      border-radius: 16px;
      padding: 18px 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .biz-item:hover, .biz-item.active-biz {
      transform: translateY(-4px);
      border-color: var(--gold-1);
      background: rgba(255, 183, 3, 0.13);
      box-shadow: 0 0 22px var(--gold-glow);
    }

    .biz-icon {
      font-size: 1.6rem;
    }

    .biz-name {
      font-weight: 700;
      font-size: 1.02rem;
    }

    /* Scene 6: 4 Learning Modules Cards (0:42 - 0:49) */
    .modules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
      gap: 18px;
      margin-top: 28px;
    }

    .module-card {
      background: linear-gradient(180deg, #171720, #0e0e14);
      border: 1.5px solid var(--border-gold);
      border-radius: 20px;
      padding: 22px 18px;
      text-align: left;
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .module-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), 0 0 24px rgba(255, 183, 3, 0.2);
    }

    .module-num {
      display: inline-block;
      background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
      color: #09090b;
      font-weight: 800;
      padding: 3px 11px;
      border-radius: 999px;
      font-size: 0.85rem;
      margin-bottom: 12px;
    }

    .module-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--gold-1);
      margin-bottom: 6px;
    }

    /* Scene 7: 2 Free Bonuses (0:50 - 0:55) */
    .bonus-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 22px;
      margin-top: 28px;
    }

    .bonus-card {
      background: #121218;
      border: 1.5px solid var(--gold-1);
      border-radius: 22px;
      padding: 28px 22px;
      box-shadow: 0 0 28px rgba(255, 183, 3, 0.14);
    }

    .free-tag {
      display: inline-block;
      margin-top: 14px;
      background: var(--gold-1);
      color: #09090b;
      font-weight: 800;
      padding: 5px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
    }

    /* Scene 8: Trust & Order Growth Chart (0:56 - 1:07) */
    .growth-box {
      background: #101016;
      border: 1.5px solid var(--border-gold);
      border-radius: 24px;
      padding: 28px 22px;
      margin-top: 26px;
    }

    .growth-badges {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 16px 0 22px;
    }

    .growth-pill {
      background: rgba(255, 183, 3, 0.15);
      border: 1px solid var(--gold-1);
      color: var(--gold-1);
      padding: 8px 18px;
      border-radius: 999px;
      font-weight: 700;
    }

    .growth-line {
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
      transition: stroke-dashoffset 1.8s ease 0.2s;
    }

    .reveal.visible .growth-line {
      stroke-dashoffset: 0;
    }

    /* Scene 9: Final Enroll CTA (1:08 - 1:16) */
    .final-cta-card {
      background: radial-gradient(circle at 50% 0%, rgba(255, 183, 3, 0.22), rgba(16, 16, 22, 0.96) 70%);
      border: 2px solid var(--gold-1);
      border-radius: 28px;
      padding: 46px 24px;
      box-shadow: 0 0 45px rgba(255, 183, 3, 0.22);
    }

    .enroll-btn {
      display: inline-block;
      margin-top: 22px;
      background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
      color: #08080a;
      font-weight: 800;
      font-size: 1.25rem;
      padding: 16px 38px;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 0 32px var(--gold-glow);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      cursor: pointer;
      border: none;
    }

    .enroll-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 44px rgba(255, 183, 3, 0.6);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: #13131a;
      border: 1.5px solid var(--gold-1);
      border-radius: 22px;
      max-width: 440px;
      width: 100%;
      padding: 28px;
      text-align: center;
      box-shadow: 0 0 36px var(--gold-glow);
    }

    .modal-box input {
      width: 100%;
      padding: 12px 14px;
      margin: 10px 0;
      border-radius: 12px;
      border: 1px solid rgba(255, 183, 3, 0.35);
      background: #09090d;
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>
  <div class="sparkle" style="top: 16%; left: 10%; animation-delay: 0s;"></div>
  <div class="sparkle" style="top: 28%; right: 12%; animation-delay: 0.9s;"></div>
  <div class="sparkle" style="top: 62%; left: 8%; animation-delay: 1.6s;"></div>
  <div class="sparkle" style="top: 78%; right: 14%; animation-delay: 2.2s;"></div>

  <header class="topbar">
    <div class="brand-logo">
      <span>SUCCESS OF SKILL</span>
      <span class="brand-badge">AI MOTION GRAPHICS</span>
    </div>
    <div class="controls">
      <button class="btn-control" id="autoShowcaseBtn" type="button">▶ অটো শোকেস: চালু করুন</button>
      <a href="#enroll" class="btn-control active">এখনই এনরোল</a>
    </div>
  </header>
