<style>
  .elim-chip {
    position: relative !important;
    overflow: visible !important;
  }
  .elim-chip::after {
    content: "" !important;
    position: absolute !important;
    left: -8% !important;
    top: 50% !important;
    width: 116% !important;
    height: 3.5px !important;
    background: linear-gradient(90deg, #ff2a2a, #ff6b6b, #ff1e1e) !important;
    border-radius: 999px !important;
    transform: translateY(-50%) rotate(-9deg) scaleX(1) !important;
    transform-origin: left center !important;
    box-shadow: 0 0 12px rgba(255, 42, 42, 0.85) !important;
    pointer-events: none !important;
  }
  .elim-chip::before {
    content: "✕" !important;
    position: absolute !important;
    top: -9px !important;
    right: -6px !important;
    width: 22px !important;
    height: 22px !important;
    border-radius: 50% !important;
    background: #ff2a2a !important;
    color: #ffffff !important;
    font-size: 0.78rem !important;
    font-weight: 800 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    box-shadow: 0 0 14px rgba(255, 42, 42, 0.85) !important;
    pointer-events: none !important;
  }
</style>

<script>
  window.addEventListener("load", function () {
    const els = document.querySelectorAll("section > *, .fan-card, .elim-chip, button, a.btn");
    els.forEach(function (el, i) {
      if (!el.animate) return;
      el.animate(
        [
          { transform: "translateY(30px) scale(0.88)", opacity: 0.2 },
          { transform: "translateY(-12px) scale(1.05)", opacity: 1, offset: 0.6 },
          { transform: "translateY(4px) scale(0.98)", opacity: 1, offset: 0.82 },
          { transform: "translateY(0px) scale(1)", opacity: 1 }
        ],
        {
          duration: 750,
          delay: i * 100,
          easing: "cubic-bezier(0.22, 1.45, 0.36, 1)",
          fill: "both"
        }
      );
    });
  });
</script>
